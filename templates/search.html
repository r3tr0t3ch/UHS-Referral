{% include "header.html" %}
<body>
    <div class="search-container">
        <h2>Search Referrals</h2>

        <div class="search-options">
            <div class="search-option">
                <h3>Search by Patient Folder Number</h3>
                <form id="reg-search-form" onsubmit="handleRegSearch(event)">
                    <div class="search-input-wrapper">
                        <input
                            type="text"
                            id="reg-search"
                            name="reg-search"
                            placeholder="Enter folder number"
                            autocomplete="off">
                        <div id="reg-suggestions" class="suggestions-dropdown"></div>
                    </div>
                    <button type="submit" class="search-button">Search</button>
                </form>
            </div>

            <div class="search-option">
                <h3>Search by Referral Date</h3>
                <form id="date-search-form" onsubmit="handleDateSearch(event)">
                    <input
                        type="date"
                        id="date-search"
                        name="date-search"
                        required>
                    <button type="submit" class="search-button">Search</button>
                </form>
            </div>
        </div>

        <div class="results-container">
            <table id="results-table" style="display: none;">
                <thead>
                    <tr>
                        <th>Referral Date</th>
                        <th>Patient No</th>
                        <th>Patient Name</th>
                        <th>Diagnosis</th>
                        <th>Reason for Referral</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>

        <div id="referral-details" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Referral Details</h3>
                <div id="detail-content"></div>
            </div>
        </div>
    </div>

    <div id="popup-handler" class="popup-handler">
        <div class="popup-content">
          <p id="popup-message"></p>
          <button id="popup-ok" class="popup-button">Okay</button>
        </div>
      </div>
    <script src="{{url_for('static', filename='search.js')}}"></script>
</body>
</html>
