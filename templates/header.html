<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Referral Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='styles.css')}}"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-container">
        <a href="https://uhs.knust.edu.gh/" class="navbar-brand">
          <img
            src="{{url_for('static', filename='UHS_LOGO.png')}}"
            alt="KNUST University Health Services Logo"
            class="navbar-logo"
          />
        </a>

        <div class="navbar-links">
          <a href="/">Home</a>
          <a href="#">Patient Records</a>
          <a href="/search">Search</a>
          <a href="#">Reports</a>
          {% if current_user.is_authenticated: %}
          <a href="/logout">Logout</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="image">
      <div class="image-overlay"></div>
    </div>
  </body>
</html>
